# @acceptanceTest. No se despliega a Render.
# El job queda en verde solo si TODAS las pruebas @acceptanceTest pasan.

name: Pipeline pruebas de aceptación


on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main', 'develop' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-aceptacion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_VERSION: '22'

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5
      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            pruebas/package-lock.json

      - name: Instalar dependencias de la app
        working-directory: app
        run: npm ci

      - name: Instalar dependencias de las pruebas
        working-directory: pruebas
        run: npm ci

      - name: Instalar Chromium para Playwright
        working-directory: pruebas
        run: npx playwright install --with-deps chromium

      - name: Levantar la app en el puerto 3000
        working-directory: app
        env:
          PORT: 3000
        run: npm start > app.log 2>&1 &
      - name: Esperar a que la app responda
        run: |
          for intento in $(seq 1 30); do
            if curl -fs http://localhost:3000 > /dev/null; then
              echo "La app respondió en el intento $intento"
              exit 0
            fi
            sleep 2
          done
          echo "La app no respondió en http://localhost:3000"
          cat app/app.log
          exit 1

 
      - name: Ejecutar pruebas de aceptación (@acceptanceTest)
        working-directory: pruebas
        run: npx playwright test --grep @acceptanceTest


      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: pruebas/playwright-report/
          retention-days: 30
